version: "3.9"

services:
  app:
    build: .
    container_name: kafa2a_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
    command: php artisan serve --host=0.0.0.0 --port=8000

  db:
    image: postgres:15
    container_name: kafa2a_db
    restart: always
    environment:
      POSTGRES_DB: kafa2a_db
      POSTGRES_USER: developer1
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"